<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Panel Hall</title>
<style>
/* ===================================================================
   PANEL HALL  ·  1920 x 1080
   Solo logo, fecha, hora y tiempo. Todo va en la barra superior para
   dejarle a la playlist el maximo espacio posible.
   El hueco lo cubre una region de Yodeck por encima:
   x=164  y=160  1593x896  (16:9)
   =================================================================== */
:root{
  --azul-oscuro:#10384F;
  --azul:#0091DF;
  --verde:#66B512;
  --texto:#10384F;
  --suave:#5B7B8C;
  --tarjeta:rgba(255,255,255,.95);
  --borde:rgba(16,56,79,.10);
  --sombra:0 6px 26px rgba(0,0,0,.34);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:1920px;height:1080px;overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--texto);-webkit-font-smoothing:antialiased;
}
body{
  /* Mismo fondo que Ingenieria y Almacen */
  background:
    radial-gradient(1200px 700px at 88% -10%, rgba(0,145,223,.16), transparent 62%),
    radial-gradient(900px 600px at -8% 108%, rgba(102,181,18,.13), transparent 64%),
    linear-gradient(145deg,#1C6690 0%,#237CAE 46%,#1A608B 100%);
  position:relative;
}
body::before,body::after{content:"";position:absolute;border-radius:50%;pointer-events:none;}
body::before{width:1500px;height:1500px;right:-520px;top:-760px;
  background:radial-gradient(circle at 50% 50%,rgba(0,145,223,.18),transparent 68%);}
body::after{width:1100px;height:1100px;left:-430px;bottom:-560px;
  background:radial-gradient(circle at 50% 50%,rgba(102,181,18,.16),transparent 68%);}

.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);
  border-radius:18px;box-shadow:var(--sombra);backdrop-filter:blur(6px);}

/* ---------- Barra superior ---------- */
#barra{position:absolute;left:40px;top:24px;width:1840px;height:112px;
  display:flex;align-items:center;padding:0 30px;gap:28px;z-index:3;}
#logo{width:74px;height:74px;flex:0 0 auto;}
#logo img{width:100%;height:100%;object-fit:contain;display:block;}
.sep{width:1px;height:58px;background:var(--borde);flex:0 0 auto;}

#fecha-bloque{display:flex;flex-direction:column;justify-content:center;gap:3px;}
#dia{font-size:19px;font-weight:700;letter-spacing:.34em;
  color:var(--verde);text-transform:uppercase;}
#fecha{font-size:27px;font-weight:600;white-space:nowrap;}

#relleno{flex:1 1 auto;}

/* Tiempo */
#tiempo{display:flex;align-items:center;gap:14px;}
#tiempo .icono{width:62px;height:62px;flex:0 0 auto;}
#tiempo .temp{font-size:40px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;}
#tiempo .desc{font-size:16px;font-weight:600;color:var(--suave);
  margin-top:2px;white-space:nowrap;}

/* Reloj */
#reloj{display:flex;align-items:baseline;gap:7px;}
#hora{font-size:62px;font-weight:700;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;}
#segundos{font-size:26px;font-weight:600;color:var(--verde);
  font-variant-numeric:tabular-nums;}

/* ---------- Hueco de la playlist ---------- */
#hueco{position:absolute;left:164px;top:160px;width:1593px;height:896px;
  border-radius:16px;background:rgba(255,255,255,.5);
  border:1px solid var(--borde);box-shadow:var(--sombra);z-index:1;
  display:flex;align-items:center;justify-content:center;}
#hueco span{font-size:22px;color:var(--suave);letter-spacing:.2em;
  text-transform:uppercase;opacity:.5;}

.apagado{opacity:.4;}
</style>
</head>
<body>

  <div id="barra" class="tarjeta">
    <div id="logo"><img src="../assets/bayer-logo.png" alt="Bayer"></div>
    <div class="sep"></div>
    <div id="fecha-bloque">
      <div id="dia">&nbsp;</div>
      <div id="fecha">&nbsp;</div>
    </div>
    <div id="relleno"></div>
    <div id="tiempo">
      <div class="icono" id="ic-tiempo"></div>
      <div>
        <div class="temp" id="temp">--°</div>
        <div class="desc" id="desc">Cargando…</div>
      </div>
    </div>
    <div class="sep"></div>
    <div id="reloj"><span id="hora">--:--</span><span id="segundos"></span></div>
  </div>

  <div id="hueco"><span>Playlist</span></div>

<script>
(function(){
"use strict";

var CONFIG = {
  zonaHoraria:"Europe/Madrid", idioma:"es-ES",
  mostrarSegundos:true,
  lat:40.4818, lon:-3.3643,        // Alcala de Henares
  minutosTiempo:15
};

/* ==================================================================
   HORA
   El reproductor esta configurado en UTC, asi que nunca se usa su
   hora local: se fuerza Europe/Madrid, con calculo manual de reserva
   por si Intl viniera recortado en la Raspberry Pi.
   ================================================================== */
var usarZona = true;
try{
  var pr = new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.zonaHoraria,hour:"2-digit",hour12:false})
             .format(new Date(Date.UTC(2026,6,15,12,0,0)));
  if(parseInt(pr,10)!==14) usarZona=false;      // julio: Madrid = UTC+2
}catch(e){ usarZona=false; }

var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
           "septiembre","octubre","noviembre","diciembre"];

// Regla UE: CEST (UTC+2) del ultimo domingo de marzo al ultimo de octubre
function ultimoDomingoUTC(a,m){
  var d=new Date(Date.UTC(a,m+1,0,1,0,0));
  d.setUTCDate(d.getUTCDate()-d.getUTCDay()); return d;
}
function esVerano(f){
  var a=f.getUTCFullYear();
  return f>=ultimoDomingoUTC(a,2) && f<ultimoDomingoUTC(a,9);
}
function aMadrid(f){ return new Date(f.getTime()+(esVerano(f)?2:1)*3600000); }
function dosDig(n){ return (n<10?"0":"")+n; }

var ultimaFecha="";
function pintarReloj(){
  var ahora=new Date(), m=aMadrid(ahora);
  var h=m.getUTCHours(), mi=m.getUTCMinutes(), se=m.getUTCSeconds();
  if(usarZona){
    try{
      new Intl.DateTimeFormat("es-ES",{timeZone:CONFIG.zonaHoraria,hour:"2-digit",
        minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(ahora)
        .forEach(function(x){
          if(x.type==="hour") h=parseInt(x.value,10);
          else if(x.type==="minute") mi=parseInt(x.value,10);
          else if(x.type==="second") se=parseInt(x.value,10);
        });
    }catch(e){}
  }
  if(h===24) h=0;
  document.getElementById("hora").textContent=dosDig(h)+":"+dosDig(mi);
  document.getElementById("segundos").textContent=CONFIG.mostrarSegundos?dosDig(se):"";

  var clave=m.getUTCFullYear()+"-"+m.getUTCMonth()+"-"+m.getUTCDate();
  if(clave!==ultimaFecha){
    ultimaFecha=clave;
    document.getElementById("dia").textContent=DIAS[m.getUTCDay()].toUpperCase();
    document.getElementById("fecha").textContent=
      m.getUTCDate()+" de "+MESES[m.getUTCMonth()]+" de "+m.getUTCFullYear();
  }
}

/* ==================================================================
   ICONOS DEL TIEMPO  (SVG propio: en Raspberry Pi los emojis pueden
   no estar instalados y saldrian como cuadrados vacios)
   ================================================================== */
var SOL="#F5A623",NUBE="#9FB6C4",NUBE2="#7C97A8",AGUA="#0091DF",NIEVE="#BBD9EC",RAYO="#F5C542";
function svg(c){ return '<svg viewBox="0 0 64 64" width="100%" height="100%">'+c+'</svg>'; }
var g_sol='<circle cx="32" cy="30" r="13" fill="'+SOL+'"/>'+
  '<g stroke="'+SOL+'" stroke-width="3.4" stroke-linecap="round">'+
  '<path d="M32 6v7M32 54v4M8 30h7M51 30h5M14 12l5 5M46 44l4 4M50 12l-5 5M18 44l-4 4"/></g>';
var g_nube='<path d="M20 44h25a10 10 0 0 0 .6-20 15 15 0 0 0-28.4 4A9 9 0 0 0 20 44z" fill="'+NUBE+'"/>';
var g_nube_osc='<path d="M20 44h25a10 10 0 0 0 .6-20 15 15 0 0 0-28.4 4A9 9 0 0 0 20 44z" fill="'+NUBE2+'"/>';
var g_solnube='<circle cx="24" cy="23" r="10" fill="'+SOL+'"/>'+
  '<g stroke="'+SOL+'" stroke-width="2.8" stroke-linecap="round">'+
  '<path d="M24 5v5M9 23h5M12 11l3.5 3.5M36 11l-3.5 3.5"/></g>'+g_nube;
function gotas(n){var s="",x=24;for(var i=0;i<n;i++,x+=9)
  s+='<path d="M'+x+' 48l-2.5 7" stroke="'+AGUA+'" stroke-width="3.4" stroke-linecap="round"/>';return s;}
function copos(n){var s="",x=24;for(var i=0;i<n;i++,x+=9)
  s+='<circle cx="'+x+'" cy="52" r="2.8" fill="'+NIEVE+'"/>';return s;}
function icono(c){
  if(c===0) return svg(g_sol);
  if(c===1||c===2) return svg(g_solnube);
  if(c===3) return svg(g_nube_osc);
  if(c===45||c===48) return svg(g_nube+'<g stroke="'+NUBE2+'" stroke-width="3" stroke-linecap="round"><path d="M18 50h28M22 57h20"/></g>');
  if(c>=51&&c<=57) return svg(g_nube+gotas(2));
  if(c>=61&&c<=67) return svg(g_nube_osc+gotas(3));
  if(c>=71&&c<=77) return svg(g_nube+copos(3));
  if(c>=80&&c<=82) return svg(g_solnube+gotas(3));
  if(c===85||c===86) return svg(g_nube+copos(3));
  if(c>=95) return svg(g_nube_osc+'<path d="M32 46l-7 11h7l-3 9 11-13h-7l4-7z" fill="'+RAYO+'"/>');
  return svg(g_nube);
}
function texto(c){
  if(c===0) return "Despejado";
  if(c===1) return "Casi despejado";
  if(c===2) return "Parcialmente nublado";
  if(c===3) return "Nublado";
  if(c===45||c===48) return "Niebla";
  if(c>=51&&c<=57) return "Llovizna";
  if(c>=61&&c<=65) return "Lluvia";
  if(c===66||c===67) return "Lluvia helada";
  if(c>=71&&c<=77) return "Nieve";
  if(c>=80&&c<=82) return "Chubascos";
  if(c===85||c===86) return "Chubascos de nieve";
  if(c===95) return "Tormenta";
  if(c>=96) return "Tormenta con granizo";
  return "—";
}

/* ==================================================================
   TIEMPO  (Open-Meteo: gratis, sin clave y con CORS abierto)
   ================================================================== */
function cargarTiempo(){
  var u="https://api.open-meteo.com/v1/forecast"+
    "?latitude="+CONFIG.lat+"&longitude="+CONFIG.lon+
    "&current=temperature_2m,weather_code"+
    "&timezone=Europe%2FMadrid&forecast_days=1";

  fetch(u).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    var c=j.current;
    document.getElementById("ic-tiempo").innerHTML=icono(c.weather_code);
    document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°";
    document.getElementById("desc").textContent=texto(c.weather_code);
    document.getElementById("tiempo").classList.remove("apagado");
  }).catch(function(){
    // Se deja el ultimo dato bueno pero atenuado, en vez de borrarlo
    document.getElementById("tiempo").classList.add("apagado");
  });
}

/* ================================================================== */
pintarReloj();  setInterval(pintarReloj,250);
cargarTiempo(); setInterval(cargarTiempo,CONFIG.minutosTiempo*60000);
})();
</script>
</body>
</html>
