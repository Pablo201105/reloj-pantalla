name: Sonda carburantes

# Temporal: solo sirve para descubrir que endpoint de precios sigue vivo.
# Se ejecuta a mano; se puede borrar en cuanto se sepa la ruta buena.
on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probar endpoints
        run: node scripts/probe-carburantes.mjs
